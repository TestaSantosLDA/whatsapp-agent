# Leads, handoffs and order drafts are emailed to the routed branch's lead_emails.
routing:
  default_branch: camarate
  rules:
    # Business line rules come first: projects always go to the technical HQ.
    - business_line: casas-modulares
      branch: azambuja
    - business_line: engenharia-estruturas
      branch: azambuja
    # Region rules (districts / regions as customers name them).
    - regions: [Norte, Porto, Braga, Viana do Castelo, Vila Real, Bragança, Aveiro, Viseu, Guarda]
      branch: maia
    - regions: [Algarve, Faro]
      branch: albufeira
    - regions: [Ribatejo, Santarém]
      branch: azambuja

