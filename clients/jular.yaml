# Jular Madeiras: client config (WA-002).
# Sources: loja.jular.pt and jular.pt, researched 2026-10-21.
# Validated by clientConfigSchema in packages/shared/src/client-config.ts.

id: jular
name: Jular Madeiras
timezone: Europe/Lisbon
languages: [pt-PT, en]
default_language: pt-PT

brand_voice: >-
  Simpático, especialista e conciso. Escreva em português europeu, tratando o
  cliente por "você" (registo formal). A Jular tem mais de 50 anos de experiência
  em madeira (fundada em 1973 por Júlia e Amaro Santos) e posiciona-se como
  sustentável e inovadora.

# Simulator for now; the real WhatsApp Cloud number comes later.
channel:
  type: simulator
  phone_number_id: sim-jular
  display_phone_number: '+351 219 484 000'

# Synced hourly from the public products.json (WA-008). Products tagged "Transporte Especial"
# in Shopify never get a checkout link (WA-013).
catalogue:
  type: shopify
  store_url: https://loja.jular.pt
  # Optional: added to checkout links as ?ref=... for attribution, if Jular wants it.
  # checkout_ref: whatsapp-agent

business_lines:
  - id: madeiras-revestimentos
    name: Madeiras e Revestimentos
    description: >-
      Madeiras, pavimentos, decks, revestimentos, placas, portas e produtos de
      manutenção. Venda pela loja online (loja.jular.pt) e nas lojas.
  - id: engenharia-estruturas
    name: Engenharia e Estruturas
    description: >-
      Estruturas em madeira lamelada colada (glulam), LVL-Kerto, CLT e vigas em I
      (I-joist); pavilhões em Kerto com vãos até 40 m; coberturas. Venda
      consultiva por projeto.
  - id: casas-modulares
    name: Casas Modulares (Treehouse)
    description: >-
      Casas pré-fabricadas em madeira Treehouse, em módulos de 22 m². A loja
      online lista Treehouse Spot T1A (€54.413,97), SW T2A (€90.412,38) e
      Douro T2 (€148.743,90), IVA incluído. Processo em 6 passos: 1) estudo de
      viabilidade, 2) conceito/design, 3) projeto detalhado, 4) desenhos
      técnicos, 5) construção em fábrica + trabalhos de fundação no terreno,
      6) transporte, montagem e acabamentos. Centro de exposição em Azambuja.
      TODO: o que está incluído no preço Treehouse (a confirmar com a Jular).

