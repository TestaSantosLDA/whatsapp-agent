# Markdown texts the agent may quote. Faithful to loja.jular.pt / jular.pt.
policies:
  pagamentos: |
    Aceitamos os seguintes métodos de pagamento: **MB Way**, **Multibanco**, **Payshop** e **transferência bancária**.

  cancelamento: |
    Pode cancelar a sua encomenda nas **24 horas úteis** seguintes à sua realização.

  confirmacao: |
    Depois de fazer a encomenda, recebe um **email de confirmação** com o número da encomenda.

  envio: |
    - **Portugal Continental:** o custo de envio é apresentado no checkout e depende do peso, das dimensões e da morada de entrega.
    - **Madeira, Açores e outros países:** o custo é orçamentado posteriormente pelo Departamento de Logística.
    - Os prazos de entrega são **meramente indicativos** e não são garantidos.
    - **Produtos especiais:** o custo e o prazo de transporte são orçamentados caso a caso, depois da encomenda. A encomenda só é processada depois de o cliente aceitar e pagar o orçamento de transporte.
    - As encomendas não são divididas: se incluir um produto especial, toda a encomenda é tratada como especial.

  descarga: |
    - O transporte **não inclui a descarga**. O camião não tem grua nem plataforma; a descarga é feita pelo cliente.
    - O local tem de ter acesso para camião e estacionamento sem bloquear o trânsito.
    - Tem de estar alguém presente na entrega.
    - Tentativas de entrega falhadas implicam custos adicionais.
    - Pode alterar a data de entrega sem custos com **48 horas** de antecedência.
    - O tempo de espera está limitado a **60 minutos**; depois disso, é cobrado **€50 por cada hora adicional**.

  recolha: |
    - Recolha **gratuita** na loja de **Camarate** (R. das Oliveiras 42, Quinta de Santa Rosa, 2680-458 Camarate).
    - A encomenda fica normalmente pronta em **2 a 4 dias**.
    - Horário de recolha: segunda a sexta, 9:00–13:00 e 14:00–18:00.
    - Deve levantar a encomenda nos **15 dias úteis** seguintes ao email de "encomenda pronta"; caso contrário, poderá ser cobrada uma taxa de armazenamento.

  danos: |
    Verifique a mercadoria no momento da entrega ou da recolha. Se houver alguma anomalia, registe-a na guia de transporte e assine. Anomalias não registadas não são da responsabilidade da Jular.

  precos: |
    - Os preços online podem ser diferentes dos preços praticados nos showrooms.
    - A loja online tem uma seleção de produtos, não a gama completa.
    - Os preços incluem **IVA a 23%**. As páginas de produto mostram também o preço por m² + IVA.

  desconto: |
    Os subscritores da newsletter têm **5% de desconto na primeira compra**. Não válido em Casas Modulares.

  produtos_fora_da_loja: |
    Alguns produtos apresentados em jular.pt não estão na loja online. Para esses, visite um dos nossos showrooms ou contacte **lojaonline@jular.pt** / **+351 219 484 000**.

  # TODO: returns window unknown; confirm with Jular and replace this text.
  devolucoes: |
    Para devoluções, consulte a política de reembolso em https://loja.jular.pt/policies/refund-policy ou contacte lojaonline@jular.pt / +351 219 484 000.

  privacidade: |
    Os seus dados são usados apenas para processar encomendas e para o acompanhamento pela equipa comercial. Nunca são vendidos nem partilhados. Política de privacidade: https://jular.pt/politica-de-privacidade

  contactos: |
    - Telefone geral: **+351 219 484 000**
    - Loja online: **+351 219 484 017** · **lojaonline@jular.pt**
    - Livro de Reclamações: https://www.livroreclamacoes.pt

